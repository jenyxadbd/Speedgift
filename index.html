<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #121315;
            --card-bg: #1A1D21;
            --card-border: #262B32;
            --accent-blue: #007AFF;
            --accent-mint: #00E676;
            --accent-gold: #FFB300;
            --danger-red: #FF3D57;
            --text-main: #FFFFFF;
            --text-sub: #7E8B9B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
        }

        .balance-box {
            background: #1C222B;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--card-border);
        }

        /* Игровой экран */
        .game-area {
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 8px;
        }

        /* Круговой таймер */
        .timer-circle-wrap {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .timer-svg circle {
            fill: none;
            stroke-width: 6;
        }

        .timer-bg { stroke: #1A2633; }
        .timer-progress {
            stroke: var(--accent-blue);
            stroke-dasharray: 408;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.1s linear;
            stroke-linecap: round;
        }

        .timer-text {
            position: absolute;
            font-size: 48px;
            font-weight: 900;
            color: #FFF;
        }

        /* НЛО полёт */
        .ufo-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: hoverUfo 2s infinite ease-in-out;
        }

        .ufo-img {
            width: 110px;
            filter: drop-shadow(0 10px 20px rgba(0, 230, 118, 0.2));
        }

        @keyframes hoverUfo {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(-3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Капсулы истории */
        .history-bar {
            display: flex;
            gap: 8px;
            padding: 0 16px;
            margin-bottom: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .capsule {
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            background: #1A212A;
            color: #8B98A5;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .capsule.current {
            background: rgba(0, 230, 118, 0.15);
            color: var(--accent-mint);
            border-color: var(--accent-mint);
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.3);
        }

        .capsule.purple { color: #D080FF; background: #261A33; }
        .capsule.gold { color: #FFB300; background: #2A241A; }
        .capsule.red { color: #FF4D4D; background: #2A1A1D; }

        /* Панель управления ставкой */
        .controls-box {
            padding: 0 16px;
            margin-bottom: 12px;
        }

        .bet-input-row {
            display: flex;
            background: #1A212A;
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 8px;
            align-items: center;
            justify-content: space-between;
        }

        .bet-input-row input {
            background: transparent;
            border: none;
            color: #FFF;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            width: 100px;
        }

        .btn-action {
            width: 100%;
            background: var(--accent-blue);
            color: #FFF;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.4);
            transition: all 0.2s;
        }

        .btn-action:active { transform: scale(0.98); }
        .btn-action.claim {
            background: #FF9800;
            box-shadow: 0 4px 20px rgba(255, 152, 0, 0.4);
        }

        /* Список игроков */
        .players-container {
            flex: 1;
            background: #16191D;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 12px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-row {
            background: #1C2128;
            border: 1px solid #232A34;
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #2A323D;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-name {
            font-size: 13px;
            font-weight: bold;
            color: #FFF;
        }

        .player-bet-badge {
            font-size: 11px;
            color: #7E8B9B;
            background: #14181E;
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .player-win-val {
            font-size: 13px;
            font-weight: bold;
            color: var(--accent-mint);
            background: rgba(0, 230, 118, 0.1);
            padding: 4px 10px;
            border-radius: 10px;
        }

        .player-win-val.pending {
            color: #7E8B9B;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Шапка -->
    <div class="header">
        <div style="font-weight: bold; font-size: 14px; color: var(--text-sub);">🛸 Epic Crash</div>
        <div class="balance-box">
            <span>💎</span> <span id="balance">12.50</span>
        </div>
    </div>

    <!-- Игровая зона -->
    <div class="game-area">
        <!-- Круговой таймер -->
        <div class="timer-circle-wrap" id="timerBox">
            <svg class="timer-svg" viewBox="0 0 140 140">
                <circle class="timer-bg" cx="70" cy="70" r="65"></circle>
                <circle class="timer-progress" id="timerCircle" cx="70" cy="70" r="65"></circle>
            </svg>
            <div class="timer-text" id="timerNum">5</div>
        </div>

        <!-- Анимация НЛО -->
        <div class="ufo-container" id="ufoBox">
            <svg class="ufo-img" viewBox="0 0 100 70" fill="none">
                <path d="M50 10 C30 10 20 25 20 30 C20 35 30 40 50 40 C70 40 80 35 80 30 C80 25 70 10 50 10 Z" fill="#4CAF50" opacity="0.7"/>
                <ellipse cx="50" cy="35" rx="45" ry="12" fill="#78909C"/>
                <ellipse cx="50" cy="38" rx="35" ry="6" fill="#37474F"/>
                <circle cx="30" cy="36" r="3" fill="#FFEB3B"/>
                <circle cx="50" cy="38" r="3" fill="#FFEB3B"/>
                <circle cx="70" cy="36" r="3" fill="#FFEB3B"/>
            </svg>
        </div>
    </div>

    <!-- Капсулы истории -->
    <div class="history-bar" id="historyBar">
        <div class="capsule current" id="currentCapsule">BET</div>
        <div class="capsule gold">10.3x</div>
        <div class="capsule purple">2.34x</div>
        <div class="capsule purple">6.12x</div>
        <div class="capsule red">1.05x</div>
    </div>

    <!-- Инпут и кнопка -->
    <div class="controls-box">
        <div class="bet-input-row">
            <span style="font-size:12px; color:var(--text-sub); font-weight:bold;">Ставка:</span>
            <input type="number" id="betInput" value="0.50" step="0.10" min="0.10" max="100.00">
            <span style="font-size:12px; color:#FFF; font-weight:bold;">TON</span>
        </div>
        <button class="btn-action" id="actionBtn">Сделать ставку</button>
    </div>

    <!-- Список игроков -->
    <div class="players-container" id="playersList">
        <!-- Блок игроков будет генерироваться скриптом -->
    </div>
</div>

<script>
    // Телеграм Юзер
    const tg = window.Telegram?.WebApp;
    let myName = "@jenyxa";
    if (tg?.initDataUnsafe?.user?.username) {
        myName = "@" + tg.initDataUnsafe.user.username;
    }

    // Состояние игры
    let userBalance = 12.50;
    let isGameRunning = false;
    let isCountingDown = false;
    let hasPlacedBet = false;
    let hasClaimed = false;
    
    let activeBet = 0.50;
    let currentMultiplier = 1.00;
    let crashPoint = 0;
    let gameInterval = null;
    let countdownInterval = null;

    // Элементы
    const timerBox = document.getElementById('timerBox');
    const ufoBox = document.getElementById('ufoBox');
    const timerNum = document.getElementById('timerNum');
    const timerCircle = document.getElementById('timerCircle');
    const actionBtn = document.getElementById('actionBtn');
    const currentCapsule = document.getElementById('currentCapsule');
    const balanceEl = document.getElementById('balance');
    const betInput = document.getElementById('betInput');
    const playersList = document.getElementById('playersList');

    // Фейк боты для имитации онлайна
    const fakeBots = [
        { name: "капитан", avatar: "https://i.pravatar.cc/100?img=11", bet: 0.52 },
        { name: "Игорь", avatar: "https://i.pravatar.cc/100?img=3", bet: 0.10 },
        { name: ".", avatar: "https://i.pravatar.cc/100?img=8", bet: 0.15 },
        { name: "Амирхан", avatar: "https://i.pravatar.cc/100?img=60", bet: 0.10 }
    ];

    actionBtn.addEventListener('click', () => {
        if (isCountingDown) {
            if (!hasPlacedBet) placeBet();
            else cancelBet();
        } else if (isGameRunning && hasPlacedBet && !hasClaimed) {
            claimWin();
        }
    });

    // 1. Старт Отсчета
    function startCountdown() {
        isCountingDown = true;
        isGameRunning = false;
        hasPlacedBet = false;
        hasClaimed = false;

        timerBox.style.display = 'flex';
        ufoBox.style.display = 'none';

        currentCapsule.innerText = "BET";
        currentCapsule.className = "capsule current";
        actionBtn.innerText = "Сделать ставку";
        actionBtn.className = "btn-action";
        actionBtn.disabled = false;
        betInput.disabled = false;

        let timeLeft = 5;
        timerNum.innerText = timeLeft;
        const totalOffset = 408;

        renderPlayersList();

        countdownInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                startFlight();
            } else {
                timerNum.innerText = Math.ceil(timeLeft);
                let progress = (timeLeft / 5) * totalOffset;
                timerCircle.style.strokeDashoffset = totalOffset - progress;
            }
        }, 100);
    }

    // 2. Полёт НЛО
    function startFlight() {
        isCountingDown = false;
        isGameRunning = true;
        currentMultiplier = 1.00;
        crashPoint = (Math.random() * 10 + 1.05).toFixed(2);

        timerBox.style.display = 'none';
        ufoBox.style.display = 'flex';
        betInput.disabled = true;

        if (hasPlacedBet) {
            actionBtn.innerText = "Забрать";
            actionBtn.className = "btn-action claim";
        } else {
            actionBtn.innerText = "В игре...";
            actionBtn.disabled = true;
        }

        gameInterval = setInterval(() => {
            currentMultiplier += 0.03;
            let formattedX = currentMultiplier.toFixed(2) + "x";

            currentCapsule.innerText = formattedX;
            updatePlayersMultipliers(formattedX);

            // Бот забирает на случайных иксах
            fakeBots.forEach(bot => {
                if(!bot.claimed && currentMultiplier >= bot.targetX) {
                    bot.claimed = true;
                    bot.winAmount = (bot.bet * currentMultiplier).toFixed(2);
                }
            });

            if (currentMultiplier >= crashPoint) {
                crash();
            }
        }, 70);
    }

    function placeBet() {
        let val = parseFloat(betInput.value);
        if (val > userBalance) return alert("Недостаточно баланса!");
        
        activeBet = val;
        userBalance -= activeBet;
        balanceEl.innerText = userBalance.toFixed(2);

        hasPlacedBet = true;
        actionBtn.innerText = "Отменить ставку";
        renderPlayersList();
    }

    function cancelBet() {
        userBalance += activeBet;
        balanceEl.innerText = userBalance.toFixed(2);
        hasPlacedBet = false;
        actionBtn.innerText = "Сделать ставку";
        renderPlayersList();
    }

    function claimWin() {
        hasClaimed = true;
        let win = (activeBet * currentMultiplier).toFixed(2);
        userBalance += parseFloat(win);
        balanceEl.innerText = userBalance.toFixed(2);

        actionBtn.innerText = `Выиграно +${win} TON!`;
        actionBtn.disabled = true;
        renderPlayersList();
    }

    function crash() {
        clearInterval(gameInterval);
        isGameRunning = false;

        currentCapsule.className = "capsule red";
        actionBtn.innerText = "Улетела!";
        actionBtn.disabled = true;

        setTimeout(() => {
            startCountdown();
        }, 2000);
    }

    // Отрисовка списка игроков внизу
    function renderPlayersList() {
        playersList.innerHTML = "";

        // Сначала ты
        if (hasPlacedBet) {
            let winText = hasClaimed ? `💎 ${(activeBet * currentMultiplier).toFixed(2)}` : `💎 ${activeBet.toFixed(2)}`;
            playersList.innerHTML += `
                <div class="player-row" style="border-color: var(--accent-blue);">
                    <div class="player-left">
                        <div class="player-avatar" style="background:var(--accent-blue); display:flex; align-items:center; justify-content:center; font-weight:bold;">J</div>
                        <div class="player-info">
                            <span class="player-name">${myName}</span>
                            <span class="player-bet-badge">💎 ${activeBet.toFixed(2)} ×${currentMultiplier.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="${hasClaimed ? 'player-win-val' : 'player-win-val pending'}">${winText}</div>
                </div>
            `;
        }

        // Заполняем остальных игроков
        fakeBots.forEach(bot => {
            bot.targetX = (Math.random() * 3 + 1.2).toFixed(2);
            bot.claimed = false;
            bot.winAmount = bot.bet.toFixed(2);

            playersList.innerHTML += `
                <div class="player-row">
                    <div class="player-left">
                        <img class="player-avatar" src="${bot.avatar}">
                        <div class="player-info">
                            <span class="player-name">${bot.name}</span>
                            <span class="player-bet-badge">💎 ${bot.bet.toFixed(2)} <span id="bot-x-${bot.name}">×1.00</span></span>
                        </div>
                    </div>
                    <div class="player-win-val pending" id="bot-win-${bot.name}">💎 ${bot.bet.toFixed(2)}</div>
                </div>
            `;
        });
    }

    function updatePlayersMultipliers(currentX) {
        fakeBots.forEach(bot => {
            const xEl = document.getElementById(`bot-x-${bot.name}`);
            const winEl = document.getElementById(`bot-win-${bot.name}`);

            if (xEl && !bot.claimed) xEl.innerText = `×${currentMultiplier.toFixed(2)}`;
            if (winEl && bot.claimed) {
                winEl.className = "player-win-val";
                winEl.innerText = `💎 ${bot.winAmount}`;
            }
        });
    }

    // Запуск
    startCountdown();
</script>
</body>
</html>
