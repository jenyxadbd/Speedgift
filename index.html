<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedgift - Ракета</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        .multiplier {
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #38bdf8;
        }
        .status {
            font-size: 18px;
            margin-bottom: 20px;
            color: #94a3b8;
        }
        button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:active {
            transform: scale(0.98);
        }
        button.cashout {
            background: #eab308;
        }
        button:disabled {
            background: #475569;
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Speedgift Rocket</h2>
        <div class="multiplier" id="multiplier">1.00x</div>
        <div class="status" id="status">Подключение к серверу...</div>
        <button id="actionBtn">Сделать ставку</button>
    </div>

    <script>
        // Подключение к актуальному туннелю
        const SOCKET_URL = 'https://every-readers-care.loca.lt';
        const socket = io(SOCKET_URL);

        const multiplierElem = document.getElementById('multiplier');
        const statusElem = document.getElementById('status');
        const actionBtn = document.getElementById('actionBtn');

        let tg = window.Telegram.WebApp;
        tg.expand();

        let gameState = 'waiting'; // waiting, running, crashed

        socket.on('connect', () => {
            statusElem.innerText = 'Ожидание раунда...';
        });

        socket.on('disconnect', () => {
            statusElem.innerText = 'Нет связи с сервером';
        });

        // Обновление состояния игры от сервера
        socket.on('game_update', (data) => {
            gameState = data.state;
            multiplierElem.innerText = data.multiplier.toFixed(2) + 'x';

            if (data.state === 'waiting') {
                statusElem.innerText = 'Ожидание начала раунда...';
                actionBtn.innerText = 'Сделать ставку';
                actionBtn.className = '';
                actionBtn.disabled = false;
            } else if (data.state === 'running') {
                statusElem.innerText = 'Ракета летит!';
                actionBtn.innerText = 'Забрать выигрыш';
                actionBtn.className = 'cashout';
                actionBtn.disabled = false;
            } else if (data.state === 'crashed') {
                statusElem.innerText = 'Краш! Ракета улетела 💥';
                actionBtn.innerText = 'Раунд завершен';
                actionBtn.disabled = true;
            }
        });

        actionBtn.addEventListener('click', () => {
            const userId = tg.initDataUnsafe?.user?.id || 'test_user';
            
            if (gameState === 'waiting') {
                socket.fn?.('place_bet', { userId });
                socket.emit('place_bet', { userId });
                actionBtn.disabled = true;
                actionBtn.innerText = 'Ставка принята';
            } else if (gameState === 'running') {
                socket.emit('cashout', { userId });
                actionBtn.disabled = true;
            }
        });
    </script>
</body>
</html>
