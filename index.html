<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedgift - Rocket Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Верхняя панель */
    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: #00e676;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
    }

    .balance {
      background: #161b22;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid #30363d;
    }

    .deposit-btn {
      background: #00e676;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    /* История иксов */
    .history {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 400px;
      justify-content: center;
    }

    .history-item {
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .history-item.green { color: #00e676; border-color: rgba(0, 230, 118, 0.3); }
    .history-item.yellow { color: #ffd600; border-color: rgba(255, 214, 0, 0.3); }
    .history-item.red { color: #ff5252; border-color: rgba(255, 82, 82, 0.3); }

    /* Экран игры */
    .game-screen {
      width: 100%;
      max-width: 400px;
      height: 220px;
      background: radial-gradient(circle, rgba(0,230,118,0.08) 0%, rgba(13,17,23,1) 70%);
      border-radius: 20px;
      border: 1px solid #21262d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    .multiplier {
      font-size: 48px;
      font-weight: 900;
      color: #00e676;
      text-shadow: 0 0 20px rgba(0, 230, 118, 0.4);
      transition: color 0.2s;
    }

    /* Кнопка ставки */
    .action-btn {
      width: 100%;
      max-width: 400px;
      height: 52px;
      background: #00e676;
      color: #000;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
      transition: all 0.2s;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    /* Последняя выплата */
    .last-win {
      margin-top: 15px;
      background: #161b22;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      color: #8b949e;
    }

    .last-win span {
      color: #00e676;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="header">
    <div class="user-avatar">J</div>
    <div class="balance">💎 12.50</div>
    <button class="deposit-btn">Пополнить</button>
  </div>

  <!-- История раундов -->
  <div class="history" id="history">
    <div class="history-item green">1.69x</div>
    <div class="history-item green">1.22x</div>
    <div class="history-item yellow">140.1x</div>
    <div class="history-item red">1.13x</div>
  </div>

  <!-- Игровое поле -->
  <div class="game-screen">
    <div class="multiplier" id="multiplier">1.00x</div>
  </div>

  <!-- Главная кнопка -->
  <button class="action-btn" id="mainBtn">Сделать ставку</button>

  <!-- Плашка снизу -->
  <div class="last-win">
    <div>AmiBol</div>
    <span>+0.30 TON (x1.50)</span>
  </div>

  <!-- ЛОГИКА ИГРЫ -->
  <script>
    let currentMultiplier = 1.00;
    let gameInterval = null;
    let isGameRunning = false;
    let crashPoint = 0;

    const multiplierEl = document.getElementById('multiplier');
    const mainBtn = document.getElementById('mainBtn');
    const historyEl = document.getElementById('history');

    mainBtn.addEventListener('click', () => {
      if (!isGameRunning) {
        startGame();
      } else {
        claimWin();
      }
    });

    function startGame() {
      isGameRunning = true;
      currentMultiplier = 1.00;
      
      // Настройка кнопки на забор
      mainBtn.innerText = 'Забрать';
      mainBtn.style.backgroundColor = '#ff9800';
      mainBtn.style.boxShadow = '0 4px 15px rgba(255, 152, 0, 0.4)';
      
      multiplierEl.style.color = '#00e676';
      
      // Точка краша (от 1.05 до 10.00)
      crashPoint = (Math.random() * 8 + 1.05).toFixed(2);

      // Запуск тиков
      gameInterval = setInterval(() => {
        currentMultiplier += 0.02;
        multiplierEl.innerText = currentMultiplier.toFixed(2) + 'x';

        if (currentMultiplier >= crashPoint) {
          crashGame();
        }
      }, 70);
    }

    function claimWin() {
      clearInterval(gameInterval);
      isGameRunning = false;
      
      const winX = currentMultiplier.toFixed(2) + 'x';
      addHistoryItem(winX, 'green');
      
      multiplierEl.innerText = 'ВЫИГРЫШ!';
      multiplierEl.style.color = '#00e676';

      resetBtn();
      
      setTimeout(() => {
        multiplierEl.innerText = '1.00x';
      }, 1500);
    }

    function crashGame() {
      clearInterval(gameInterval);
      isGameRunning = false;
      
      const crashX = crashPoint + 'x';
      addHistoryItem(crashX, 'red');

      multiplierEl.innerText = 'ВЗЛЕТЕЛА!';
      multiplierEl.style.color = '#ff5252';

      resetBtn();

      setTimeout(() => {
        multiplierEl.innerText = '1.00x';
        multiplierEl.style.color = '#00e676';
      }, 1500);
    }

    function resetBtn() {
      mainBtn.innerText = 'Сделать ставку';
      mainBtn.style.backgroundColor = '#00e676';
      mainBtn.style.boxShadow = '0 4px 15px rgba(0, 230, 118, 0.3)';
    }

    function addHistoryItem(val, colorClass) {
      const newDiv = document.createElement('div');
      newDiv.className = `history-item ${colorClass}`;
      newDiv.innerText = val;
      
      historyEl.insertBefore(newDiv, historyEl.firstChild);
      if (historyEl.children.length > 4) {
        historyEl.removeChild(historyEl.lastChild);
      }
    }
  </script>
</body>
</html>
