<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TON Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #121315;
            --card-bg: #1A1D21;
            --card-border: #262B32;
            --accent-mint: #00E676;
            --accent-gold: #FFB300;
            --danger-red: #FF3D57;
            --text-main: #FFFFFF;
            --text-sub: #7E8B9B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 12px;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-mint), #00A859);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid var(--accent-mint);
            color: #000;
        }

        .balance-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Игровая зона */
        .game-area {
            height: 180px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            position: relative;
        }

        .multiplier-val {
            font-size: 48px;
            font-weight: 900;
            color: var(--accent-mint);
            text-shadow: 0 0 20px rgba(0, 230, 118, 0.4);
            transition: color 0.2s, text-shadow 0.2s;
        }

        /* Капсулы истории */
        .history-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .capsule {
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            white-space: nowrap;
        }

        .capsule.win { color: var(--accent-mint); border-color: rgba(0, 230, 118, 0.3); }
        .capsule.gold { color: var(--accent-gold); border-color: rgba(255, 179, 0, 0.3); }
        .capsule.purple { color: #E040FB; border-color: rgba(224, 64, 251, 0.3); }
        .capsule.crash { color: var(--danger-red); border-color: rgba(255, 61, 87, 0.3); }

        /* Блок выбора ставки */
        .bet-control-box {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 6px 12px;
            margin-bottom: 10px;
            gap: 10px;
        }

        .bet-control-box label {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .bet-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            outline: none;
        }

        .btn-main-action {
            background: var(--accent-mint);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-main-action:active { transform: scale(0.98); }

        /* Игроки внизу */
        .players-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .player-card {
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            padding: 10px 12px; 
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Шапка -->
    <div class="header">
        <div class="user-info">
            <div class="avatar" id="avatarName">J</div>
        </div>
        <div class="balance-box">
            <span>💎</span> <span id="balance">12.50</span>
        </div>
    </div>

    <!-- Капсулы истории -->
    <div class="history-bar" id="historyCapsules">
        <div class="capsule gold">10.30x</div>
        <div class="capsule purple">2.34x</div>
        <div class="capsule purple">6.12x</div>
        <div class="capsule crash">1.05x</div>
    </div>

    <!-- Игровая зона -->
    <div class="game-area">
        <div class="multiplier-val" id="multiplier">1.00x</div>
    </div>

    <!-- Поле ввода ставки -->
    <div class="bet-control-box">
        <label for="betAmount">Ставка:</label>
        <input type="number" id="betAmount" class="bet-input" value="0.50" step="0.10" min="0.10" max="100.00">
        <span style="font-size:12px; color:var(--text-sub); font-weight:bold;">TON</span>
    </div>

    <button class="btn-main-action" id="mainBtn">Сделать ставку</button>

    <!-- Ставка игрока внизу -->
    <div class="players-list" id="playersList">
        <div class="player-card" id="myBetCard">
            <div style="display:flex; align-items:center; gap:8px;">
                <div style="width:24px; height:24px; background:#222; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;" id="playerIcon">J</div>
                <b id="playerName">@jenyxa</b>
            </div>
            <span style="color:var(--text-sub); font-weight:bold;" id="playerBetStatus">Ожидание ставки</span>
        </div>
    </div>
</div>

<script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    let userName = "@jenyxa";

    if (tg) { 
        tg.ready(); 
        tg.expand(); 
        if (tg.initDataUnsafe?.user?.username) {
            userName = "@" + tg.initDataUnsafe.user.username;
            document.getElementById('playerName').innerText = userName;
            document.getElementById('avatarName').innerText = userName.charAt(1).toUpperCase();
            document.getElementById('playerIcon').innerText = userName.charAt(1).toUpperCase();
        }
    }

    // ЛОГИКА РАКЕТКИ С ВВОДОМ СТАВКИ
    let userBalance = 12.50;
    let currentMultiplier = 1.00;
    let gameInterval = null;
    let isGameRunning = false;
    let crashPoint = 0;
    let activeBet = 0.50;

    const multiplierEl = document.getElementById('multiplier');
    const mainBtn = document.getElementById('mainBtn');
    const historyCapsules = document.getElementById('historyCapsules');
    const balanceEl = document.getElementById('balance');
    const betInput = document.getElementById('betAmount');
    const playerBetStatus = document.getElementById('playerBetStatus');

    mainBtn.addEventListener('click', () => {
        if (!isGameRunning) {
            startGame();
        } else {
            claimWin();
        }
    });

    function startGame() {
        // Чтение и валидация суммы ставки
        let betValue = parseFloat(betInput.value);
        if (isNaN(betValue) || betValue < 0.10) {
            alert('Минимальная ставка — 0.10 TON');
            return;
        }
        if (betValue > 100.00) {
            alert('Максимальная ставка — 100.00 TON');
            return;
        }
        if (betValue > userBalance) {
            alert('Недостаточно баланса!');
            return;
        }

        activeBet = betValue;
        userBalance -= activeBet;
        balanceEl.innerText = userBalance.toFixed(2);

        isGameRunning = true;
        currentMultiplier = 1.00;
        betInput.disabled = true; // Запрещаем изменять ставку во время игры

        // Отображение ставки внизу
        playerBetStatus.innerText = `В игре: ${activeBet.toFixed(2)} TON`;
        playerBetStatus.style.color = 'var(--accent-gold)';

        // Меняем кнопку на "Забрать"
        mainBtn.innerText = 'Забрать';
        mainBtn.style.backgroundColor = '#FF9800';
        mainBtn.style.boxShadow = '0 4px 15px rgba(255, 152, 0, 0.4)';

        // Рандомная точка взрыва от 1.05x до 15.00x
        crashPoint = (Math.random() * 14 + 1.05).toFixed(2);

        gameInterval = setInterval(() => {
            currentMultiplier += 0.03;
            multiplierEl.innerText = currentMultiplier.toFixed(2) + 'x';

            // Градиентная смена цвета в зависимости от коэффициента
            if (currentMultiplier < 2.00) {
                multiplierEl.style.color = 'var(--accent-mint)';
                multiplierEl.style.textShadow = '0 0 20px rgba(0,230,118,0.4)';
            } else if (currentMultiplier < 5.00) {
                multiplierEl.style.color = '#FFB300';
                multiplierEl.style.textShadow = '0 0 20px rgba(255,179,0,0.5)';
            } else if (currentMultiplier < 10.00) {
                multiplierEl.style.color = 'var(--accent-gold)';
                multiplierEl.style.textShadow = '0 0 25px rgba(255,215,0,0.6)';
            } else {
                multiplierEl.style.color = '#E040FB';
                multiplierEl.style.textShadow = '0 0 35px rgba(224,64,251,0.8)';
            }

            if (currentMultiplier >= crashPoint) {
                crashGame();
            }
        }, 60);
    }

    function claimWin() {
        clearInterval(gameInterval);
        isGameRunning = false;
        betInput.disabled = false;

        const winX = currentMultiplier.toFixed(2);
        const winAmount = (activeBet * currentMultiplier).toFixed(2);
        
        // Пополнение баланса
        userBalance += parseFloat(winAmount);
        balanceEl.innerText = userBalance.toFixed(2);

        // Обновление статуса в плашке внизу
        playerBetStatus.innerText = `+${winAmount} TON (x${winX})`;
        playerBetStatus.style.color = 'var(--accent-mint)';

        let capType = 'win';
        if (currentMultiplier >= 10) capType = 'purple';
        else if (currentMultiplier >= 5) capType = 'gold';

        addHistoryItem(winX + 'x', capType);

        multiplierEl.innerText = 'ВЫИГРЫШ!';
        multiplierEl.style.color = 'var(--accent-mint)';
        multiplierEl.style.textShadow = '0 0 20px rgba(0,230,118,0.4)';

        resetMainBtn();
    }

    function crashGame() {
        clearInterval(gameInterval);
        isGameRunning = false;
        betInput.disabled = false;

        const crashX = crashPoint + 'x';
        addHistoryItem(crashX, 'crash');

        // Потеря ставки
        playerBetStatus.innerText = `0.00 TON (${crashX})`;
        playerBetStatus.style.color = 'var(--danger-red)';

        multiplierEl.innerText = 'ВЗЛЕТЕЛА!';
        multiplierEl.style.color = 'var(--danger-red)';
        multiplierEl.style.textShadow = '0 0 20px rgba(255,61,87,0.5)';

        resetMainBtn();

        setTimeout(() => {
            multiplierEl.innerText = '1.00x';
            multiplierEl.style.color = 'var(--accent-mint)';
            multiplierEl.style.textShadow = '0 0 20px rgba(0,230,118,0.4)';
        }, 1500);
    }

    function resetMainBtn() {
        mainBtn.innerText = 'Сделать ставку';
        mainBtn.style.backgroundColor = 'var(--accent-mint)';
        mainBtn.style.boxShadow = '0 4px 15px rgba(0, 230, 118, 0.3)';
    }

    function addHistoryItem(text, type) {
        const item = document.createElement('div');
        item.className = `capsule ${type}`;
        item.innerText = text;
        historyCapsules.insertBefore(item, historyCapsules.firstChild);
    }
</script>
</body>
</html>
