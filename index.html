<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Краш Игра</title>
    <!-- Подключаем клиентскую библиотеку Socket.IO -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #status {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ffa726;
        }
        #multiplier {
            font-size: 48px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="status">Подключение к серверу...</div>
    <div id="multiplier">1.00x</div>

    <script>
        // Сообщаем Telegram, что Web App готов
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        // Подключаемся к туннелю LocalTunnel
        const socket = io('https://wild-parts-give.loca.lt', {
            transports: ['websocket', 'polling']
        });

        const statusEl = document.getElementById('status');
        const multiplierEl = document.getElementById('multiplier');

        socket.on('connect', () => {
            statusEl.innerText = '🟢 Соединение установлено!';
            statusEl.style.color = '#4caf50';
        });

        socket.on('disconnect', () => {
            statusEl.innerText = '🔴 Связь с сервером потеряна';
            statusEl.style.color = '#f44336';
        });

        // Слушаем обновления коэффициента от сервера
        socket.on('tick', (data) => {
            multiplierEl.innerText = data.multiplier.toFixed(2) + 'x';
        });

        // Слушаем событие краша
        socket.on('crash', (data) => {
            multiplierEl.innerText = 'CRASH! (' + data.finalMultiplier.toFixed(2) + 'x)';
            multiplierEl.style.color = '#f44336';
        });
    </script>
</body>
</html>
